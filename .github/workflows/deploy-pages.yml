name: Deploy to GitHub Pages

# Build static export & publish ke GitHub Pages.
# Repo harus mengaktifkan Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute base path from repository name
        id: base
        run: echo "path=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      - name: Build static export (output written to out/)
        run: bun run build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.path }}

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
